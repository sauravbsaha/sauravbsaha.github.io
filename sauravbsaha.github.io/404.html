<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Saurav Bhaskar Saha</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23173f73'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='30' font-weight='700' fill='%23ffffff' text-anchor='middle'%3ESS%3C/text%3E%3C/svg%3E">
<style>
:root{--navy:#173f73;--bg:#f5f7fa;--surface:#fff;--text:#1b2733;--muted:#5a6b7d;--border:#dde5ee}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--navy:#5b9bd5;--bg:#0b1220;--surface:#131e30;--text:#dbe4ef;--muted:#9aabbf;--border:#26344a}
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
  font-family:"Inter","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  background:var(--bg);color:var(--text);
}
.box{
  max-width:520px;text-align:center;background:var(--surface);
  border:1px solid var(--border);border-radius:16px;padding:48px 36px;
  box-shadow:0 8px 30px rgba(16,32,53,.08);
}
.code{font-family:Georgia,serif;font-size:4rem;line-height:1;color:var(--navy);margin:0 0 10px}
h1{font-size:1.4rem;margin:0 0 10px;color:var(--text)}
p{color:var(--muted);margin:0 0 26px}
a.btn{
  display:inline-block;padding:12px 22px;border-radius:10px;
  background:var(--navy);color:#fff;text-decoration:none;font-weight:600;
}
a.btn:hover{opacity:.9}
</style>
</head>
<body>
  <div class="box">
    <p class="code">404</p>
    <h1>This page could not be found</h1>
    <p>The page you were looking for does not exist or may have moved.</p>
    <a class="btn" href="/">Back to the homepage</a>
  </div>
</body>
</html>
