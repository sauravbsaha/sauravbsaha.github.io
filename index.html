<h1>Saurav Bhaskar Saha, PhD, FRSB</h1>

<p class="major">
Bioinformatics Lead | Target Identification & Validation |
Computational Drug Discovery | AI-Enabled Discovery
</p>

<p>
Bioinformatics Lead specialising in Target Identification and computational drug discovery.
</p>

<p>
Working at the intersection of Biology, Cheminformatics, Data Science and Artificial Intelligence, I develop computational strategies that accelerate target identification, prioritisation and early discovery research.
</p>

<p>
At Sygnature Discovery, I collaborate closely with multidisciplinary teams across Oncology, Neuroscience, Metabolic Disease and Immunology programmes, building explainable human-in-the-loop approaches that support confident and efficient scientific decision-making.
</p>

<p>
I helped establish and grow the Bioinformatics capability at Sygnature Discovery, contributing to strategy development, mentoring scientists and strengthening computational expertise across the organisation.
</p>

<p>
Before joining industry, I spent more than a decade in academia leading research in antimicrobial resistance (AMR), bacterial genomics and computational biology. During this period I developed several widely used bioinformatics resources, including uCARE and uCAREChemSuiteCLI, supervised undergraduate and postgraduate research projects and published internationally.
</p>

<p>
I am a Fellow of the Royal Society of Biology (FRSB) and was invited as an expert participant at the European Commission JRC Workshop on Antimicrobial Resistance Databases.
</p>
